name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v
      - name: Audit dependencies for known vulnerabilities
        run: |
          # setuptools is runner build tooling, not a project dependency; upgrade it
          # so an old preinstalled copy doesn't fail the audit of what we actually ship.
          pip install --upgrade setuptools pip-audit
          pip-audit --skip-editable

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t generic-data-mcp:ci .
