[project]
name = "generic-data-mcp"
version = "0.1.0"
description = "MCP server that ingests structured files into SQLite and exposes them as queryable tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "sqlglot>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
generic-data-mcp = "src.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
