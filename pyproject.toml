[project]
name = "generic-data-mcp"
version = "0.1.0"
description = "MCP server that ingests structured files into SQLite and exposes them as queryable tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "sqlglot>=26,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Local web upload GUI (ingestion console) + Excel ingestion.
# Install with: pip install -e ".[ui]"
ui = [
    "flask>=3",
    "openpyxl>=3.1",
]

[project.scripts]
generic-data-mcp = "src.server:main"
generic-data-mcp-ui = "src.webui.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.webui" = ["static/*"]
